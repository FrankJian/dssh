[package]
name = "dssh"
version = "0.4.24"
description = "A lightweight cross-platform SSH manager"
authors = ["Jian-Frank Xie"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"
tokio = { version = "1.52.3", features = ["sync", "io-util", "process", "fs", "net", "rt", "time", "macros"] }
futures = "0.3"
portable-pty = "0.9.0"
genai = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "socks"] }
aes-gcm = "0.11.0"
argon2 = "0.5.3"
base64 = "0.22.1"
rand = "0.10.2"
sha2 = "0.10.9"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
aws-config = "1.9.0"
aws-sdk-s3 = "1.138.0"
aws-credential-types = "1.3.0"
aws-smithy-types = { version = "1.6.1", features = ["rt-tokio"] }
font-kit = "0.14.3"
