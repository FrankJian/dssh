[package]
name = "dssh"
version = "0.7.0"
description = "A lightweight cross-platform SSH manager"
authors = ["Jian-Frank Xie"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = ["unstable"] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
percent-encoding = "2.3.2"
serde_yaml = "0.9"
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
russh = { version = "0.65.4", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "4.0.0"
tokio = { version = "1.54.1", features = ["sync", "io-util", "process", "fs", "net", "rt", "time", "macros"] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
zmodem2 = "=0.7.3"
futures = "0.3.34"
portable-pty = "0.9.0"
genai = "0.7.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "socks"] }
aes-gcm = "0.11.1"
argon2 = "0.6.0"
base64 = "0.23.1"
flate2 = "1.1.11"
rand = "0.10.4"
sha2 = "0.11.2"
hmac = "0.13.0"
httpdate = "1.0.3"
cookie = "0.18.3"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
aws-config = "1.13.4"
aws-sdk-s3 = "1.162.0"
aws-credential-types = "1.3.1"
aws-smithy-types = { version = "1.9.5", features = ["rt-tokio"] }
font-kit = "0.14.3"
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
zeroize = { version = "1.9.2", features = ["serde"] }
rustls-native-certs = "0.8.5"
tauri-plugin-clipboard-manager = "2.5.0"
tempfile = "3.27.0"
encoding_rs = "=0.8.44"
notify = "=9.0.0"
globset = "=0.4.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
