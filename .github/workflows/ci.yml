name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm exec tsc --noEmit

      - name: Install Fish for shell integration tests
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: brew install fish

      - name: Test command history and shell integration
        timeout-minutes: 2
        run: node --experimental-strip-types --test src/terminal/commandCompletion.test.mjs src/terminal/historyShellIntegration.test.mjs src/terminal/completionPosition.test.mjs

      - name: Build frontend
        run: pnpm build

  package:
    name: Package ${{ matrix.name }}
    # Pull requests are validated above, but only branch pushes create downloadable
    # test installers.
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            installer: src-tauri/target/release/bundle/dmg/**/*.dmg
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned test installer
        # Test builds intentionally do not consume release signing secrets or
        # generate updater artifacts. The tag-triggered Release workflow remains
        # responsible for signed, published releases.
        run: pnpm tauri build --no-sign --config src-tauri/tauri.ci.conf.json

      - name: Upload macOS test installer
        if: matrix.name == 'macOS'
        uses: actions/upload-artifact@v7.0.1
        with:
          path: ${{ matrix.installer }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows NSIS test installer
        if: matrix.name == 'Windows'
        uses: actions/upload-artifact@v7.0.1
        with:
          path: src-tauri/target/release/bundle/nsis/**/*.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows raw executable
        if: matrix.name == 'Windows'
        uses: actions/upload-artifact@v7.0.1
        with:
          path: src-tauri/target/release/dssh.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows MSI test installer
        if: matrix.name == 'Windows'
        uses: actions/upload-artifact@v7.0.1
        with:
          path: src-tauri/target/release/bundle/msi/**/*.msi
          archive: false
          if-no-files-found: error
          retention-days: 14
